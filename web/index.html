<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b0a">
<title>Ritmo · tu música</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span><span class="brand-name">RITMO</span></div>
    <nav class="nav">
      <button class="nav-btn active" data-view="home"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"/></svg><span>Inicio</span></button>
      <button class="nav-btn" data-view="search"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 4a6.8 6.8 0 1 0 0 13.6 6.8 6.8 0 0 0 0-13.6ZM16 16l5 5"/></svg><span>Buscar</span></button>
      <button class="nav-btn" data-view="favorites"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/></svg><span>Me gusta</span></button>
      <button class="nav-btn" data-view="playlists"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16M7 5v.01M7 12v.01M7 19v.01"/></svg><span>Playlists</span></button>
    </nav>
    <div class="side-foot"><p>Tu música, siempre a mano.</p></div>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="title">Inicio</h1>
      <div class="searchbox"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 4a6.8 6.8 0 1 0 0 13.6 6.8 6.8 0 0 0 0-13.6ZM16 16l5 5"/></svg></span><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar música"></div>
    </header>
    <section id="content" class="content"><div class="empty">Cargando música…</div></section>
  </main>
</div>

<div id="player" class="player">
  <button id="miniOpen" class="p-track" type="button" aria-label="Abrir reproductor">
    <span id="miniArt" class="p-art"></span>
    <span class="p-text"><span id="miniTitle" class="p-title">Elige una canción</span><span id="miniArtist" class="p-artist">Ritmo</span></span>
  </button>
  <div class="p-center">
    <div class="p-controls">
      <button id="miniPrev" class="icon-btn" title="Anterior"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m13-14-11 7 11 7z"/></svg></button>
      <button id="miniPlay" class="play-btn" title="Reproducir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></button>
      <button id="miniNext" class="icon-btn" title="Siguiente"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button>
    </div>
    <div class="p-seek"><span id="miniCurrent">0:00</span><input id="miniRange" type="range" min="0" max="1000" value="0"><span id="miniDuration">0:00</span></div>
  </div>
  <button id="miniFav" class="icon-btn" title="Me gusta"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/></svg></button>
</div>

<div id="playerScreen" class="player-screen" hidden>
  <div class="player-top"><button id="closePlayer" class="icon-btn" aria-label="Cerrar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><span>REPRODUCIENDO AHORA</span><button id="openPlayer" class="icon-btn" aria-label="Abrir reproductor"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></button></div>
  <div class="player-main">
    <div id="playerArt" class="player-art"></div>
    <div class="player-info"><h2 id="playerTitle">Elige una canción</h2><p id="playerArtist">Ritmo</p></div>
    <div class="player-seek"><input id="playerRange" type="range" min="0" max="1000" value="0"><div><span id="playerCurrent">0:00</span><span id="playerDuration">0:00</span></div></div>
    <div class="player-controls">
      <button id="playerShuffle" class="icon-btn" title="Aleatorio"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 4-5 4M3 7h2.5c5 0 8 10 13 10H21m-5-4 5 4-5 4M3 17h2.5c1.5 0 2.7-1.5 3.8-3M12.7 9c1.1-1.3 2.2-2 3.8-2H21"/></svg></button>
      <button id="playerPrev" class="icon-btn large" title="Anterior"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m13-14-11 7 11 7z"/></svg></button>
      <button id="playerPlay" class="play-btn large" title="Reproducir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></button>
      <button id="playerNext" class="icon-btn large" title="Siguiente"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button>
      <button id="playerRepeat" class="icon-btn" title="Repetir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15m-14 16-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
    <div class="player-actions"><button id="playerFav" class="icon-btn" title="Me gusta"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.1-8.8 10.2-8.8 10.2S3.2 13.9 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/></svg></button><div class="player-utility-actions"><button id="playerLyrics" class="icon-btn" type="button" title="Letras" aria-label="Mostrar letras"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-3 0h6"/></svg></button><button id="playerQueue" class="icon-btn" type="button" title="Cola de reproducción" aria-label="Mostrar cola" aria-expanded="false" aria-controls="queuePanel"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><button id="playerDownload" class="icon-btn" type="button" title="Descargar" aria-label="Descargar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/></svg></button></div></div>
    <div id="queueAnchor" hidden></div><section id="queuePanel" class="queue-panel" hidden>
      <header class="queue-heading"><div><strong>Cola de reproducción</strong><span id="queueSummary"></span></div><button id="closeQueue" class="icon-btn" aria-label="Ocultar cola"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="queueList" class="queue-list"></div>
    </section>
  </div>
</div>

<div id="lyrics" class="modal" hidden>
  <div class="lyrics-layout"><aside class="lyrics-track-panel"><span class="lyrics-eyebrow">REPRODUCIENDO AHORA</span><div id="lyricsTrackArt" class="lyrics-track-art"></div><div class="lyrics-track-copy"><h2 id="lyricsTrackTitle">Elige una canción</h2><p id="lyricsTrackArtist">Ritmo</p></div></aside><section class="lyrics-card"><button id="closeLyrics" class="modal-close icon-btn" type="button" aria-label="Cerrar letras" title="Cerrar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div class="lyrics-topline"><h2 id="lyricsTitle">Letra</h2></div><div id="lyricsText" class="lyrics-text">Selecciona una canción.</div></section><div id="lyricsQueueSlot" class="lyrics-queue-slot"></div><footer class="lyrics-transport"><div class="lyrics-timeline"><span id="lyricsCurrent">0:00</span><input id="lyricsRange" type="range" min="0" max="1000" value="0" aria-label="Posición de reproducción"><span id="lyricsDuration">0:00</span></div><div class="lyrics-controls"><button id="lyricsShuffle" class="icon-btn" type="button" title="Aleatorio" aria-label="Aleatorio"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 4-5 4M3 7h2.5c5 0 8 10 13 10H21m-5-4 5 4-5 4M3 17h2.5c1.5 0 2.7-1.5 3.8-3M12.7 9c1.1-1.3 2.2-2 3.8-2H21"/></svg></button><button id="lyricsPrev" class="icon-btn" type="button" title="Anterior" aria-label="Anterior"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m13-14-11 7 11 7z"/></svg></button><button id="lyricsPlay" class="play-btn" type="button" title="Reproducir" aria-label="Reproducir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg></button><button id="lyricsNext" class="icon-btn" type="button" title="Siguiente" aria-label="Siguiente"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button><button id="lyricsRepeat" class="icon-btn" type="button" title="Repetir" aria-label="Repetir"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15m-14 16-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg></button><button id="lyricsQueueToggle" class="icon-btn" type="button" title="Mostrar cola" aria-label="Mostrar cola" aria-expanded="false" aria-controls="queuePanel" hidden><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button></div></footer></div>
</div>
<audio id="audio" preload="none"></audio>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
